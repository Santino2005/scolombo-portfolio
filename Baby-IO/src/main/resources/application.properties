# Add these properties to your application.properties file
# JWT Configuration - Use a longer, more secure secret (64+ characters for HS512)
jwt.secret=myVerySecureJWTSecretKeyThatIsAtLeast64CharactersLongForHS512Algorithm123456789012345678901234567890
jwt.expirationMs=86400000

# Keep your existing database and server configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/babyio_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgresdba}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.address=0.0.0.0
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# CORS configuration 
spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://13.219.34.10:3000,http://13.219.34.10,http://52.202.248.7:3000,http://52.202.248.7
spring.web.cors.allow-credentials=true

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR
logging.level.com.baby_io=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# MQTT Configuration
mqtt.broker=tcp://localhost:1883
mqtt.topic=esp32/sensores

# WebSocket Configuration
spring.websocket.enabled=true
spring.websocket.allowed-origins=*

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC