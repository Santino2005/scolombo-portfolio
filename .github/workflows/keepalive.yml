name: Keep Backends Alive (Keep-Alive Cron)

on:
  schedule:
    # Se ejecuta cada 10 minutos para evitar que servicios gratuitos (Render, etc.) entren en reposo
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backends:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping to backends
        run: |
          URLS=()
          
          # Render / General Backend
          if [ -n "${{ secrets.RENDER_BACKEND_URL }}" ]; then
            URLS+=("${{ secrets.RENDER_BACKEND_URL }}")
          fi

          # GenoPass Backend
          if [ -n "${{ secrets.GENOPASS_BACKEND_URL }}" ]; then
            URLS+=("${{ secrets.GENOPASS_BACKEND_URL }}")
          fi

          # Extra URLs (separadas por espacio o coma si están definidas)
          if [ -n "${{ secrets.EXTRA_BACKEND_URLS }}" ]; then
            for url in ${{ secrets.EXTRA_BACKEND_URLS }}; do
              URLS+=("$url")
            done
          fi

          if [ ${#URLS[@]} -eq 0 ]; then
            echo "⚠️ No backend URLs configured in GitHub Secrets."
            echo "Please set RENDER_BACKEND_URL or GENOPASS_BACKEND_URL in GitHub Repo Settings -> Secrets -> Actions"
            exit 0
          fi

          for BASE_URL in "${URLS[@]}"; do
            # Limpiar trailing slash
            CLEAN_URL="${BASE_URL%/}"
            TARGET_URL="$CLEAN_URL/health"
            
            echo "--------------------------------------------------"
            echo "📡 Pinging $TARGET_URL ..."
            
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$TARGET_URL" || echo "000")
            echo "Response HTTP Status: $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "✅ Service at $CLEAN_URL is alive and responding!"
            else
              echo "⚠️ Warning: Service at $CLEAN_URL returned HTTP $HTTP_STATUS"
            fi
          done
          echo "--------------------------------------------------"
