name: Deploy UberClocked to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'UberClocked/**'
  workflow_dispatch:

jobs:
  deploy-uberclocked:
    name: Build and Deploy UberClocked Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./UberClocked/frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./UberClocked/frontend
        run: npm run build
