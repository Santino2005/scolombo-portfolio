services:
  #Usar postgres dockerizado de backend
  backend:
    container_name: backend
    image: ghcr.io/facultaddeingenieria/tome-back:dev-latest #verificar nombre de imagen y tag correctos
    env_file:
      - .env.backend
    ports:
      - '8080:8080'
  #    networks:
  #      - tome-net

  front:
    container_name: front
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    ports: ['3000:3000']
    depends_on:
      - backend
#    networks:
#      - tome-net

