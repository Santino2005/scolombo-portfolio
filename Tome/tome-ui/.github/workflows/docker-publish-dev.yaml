name: Docker Publish (dev)
on:
  push:
    branches: [dev]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY}}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          REPO=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          SHA=${GITHUB_SHA::7}
          echo "IMAGE_NAME=${REPO}" >> $GITHUB_OUTPUT
          echo "TAG=dev-latest" >> $GITHUB_OUTPUT
          echo "SHA_TAG=dev-${SHA}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.IMAGE_NAME }}:${{ steps.meta.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.IMAGE_NAME }}:${{ steps.meta.outputs.SHA_TAG }}
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      #       - name: Power ON Azure VM
      #         uses: roel4ez/action-power-on-off-azure-vm@v1.0.1
      #         with:
      #          AZURE_VM_NAME: ${{ secrets.AZURE_DEV_VM_NAME }}
      #          AZURE_RG_NAME: ${{ secrets.AZURE_RG_NAME }}
      #          POWER_SWITCH: 'ON'
      #          AZURE_SP_CLIENTID: ${{ secrets.AZURE_SP_CLIENTID }}
      #          AZURE_SP_SECRET: ${{ secrets.AZURE_SP_SECRET }}
      #          AZURE_TENANTID: ${{ secrets.AZURE_TENANTID }}

      - name: Wait for VM to be reachable
        run: |
          echo "Waiting for VM to accept SSH connections..."
          for i in {1..30}; do
            if nc -zv ${{ secrets.DEV_IP }} 22 >/dev/null 2>&1; then
              echo "VM is online!"
              break
            fi
            echo "Attempt $i/30: VM not ready yet..."
            sleep 10
          done

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEV_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEV_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Development
        run: |
          ssh tome-dev@${{ secrets.DEV_IP }} << 'EOF'
            cd tome-infra

            echo "Esperando a que el daemon de Docker esté disponible..."
            for i in {1..30}; do
              # Si systemd está presente, chequea el servicio
              if sudo systemctl is-active --quiet docker 2>/dev/null; then
                echo "docker activo (systemctl)"
                break
              fi
              # Si no, intenta una llamada directa al cliente Docker
              if sudo docker info >/dev/null 2>&1; then
                echo "docker respondiendo (docker info)"
                break
              fi
              echo "Intento $i/30: docker no listo, esperando 5s..."
              sleep 5
            done

            sudo su
            docker compose -f docker-compose.dev.yaml down front
            docker-compose -f docker-compose.dev.yaml pull front
            docker-compose -f docker-compose.dev.yaml up -d front
            docker image prune -f
          EOF

