services:
 # Usar db existente en el otro compose
  api:
    container_name: TOME-API-PRE-PUBLISH
    build:
      context: .
      dockerfile: Prod.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_DRIVER}://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}"
    ports:
      - "${API_PORT}:8080"
    networks:
      - tome-net

  front:
    container_name: tome-ui
    image: ghcr.io/facultaddeingenieria/tome-ui:dev-latest
    env_file:
      - .env.front
    ports: [ '3000:3000' ]
    networks:
      - tome-net

networks:
  tome-net:
    external: true
    name: tome_network
