services:
  api:
    container_name: TOME-API
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_DRIVER}://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}"
    ports:
      - "${API_PORT}:8080"
    depends_on:
      - db
    volumes:
      - gradle-cache:/home/gradle/.gradle
    networks:
      - tome-net

  db:
    container_name: TOME-DB
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    env_file:
      - .env
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - tome-net

volumes:
  db:
  gradle-cache:
networks:
  tome-net:
    name: tome_network
